# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-soquartz-cm4
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # arm-trusted-firmware treats rk3566/rk3568 as a single platform
  - stage: arm-trusted-firmware-rk3568
  - stage: rkbin-rk3566
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
        SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # soquartz-cm4-rk3566
      - |
        tar xf u-boot.tar.bz2 --strip-components=1

        # 8 GB modules: bounce EFI disk I/O below 4 GiB (dw_mmc IDMAC is 32-bit). Pending upstream.
        patch -p1 < /pkg/patches/0001-rockchip-rk3568-imply-EFI_LOADER_BOUNCE_BUFFER.patch
      - |
        make soquartz-cm4-rk3566_defconfig
      # DEBUG (test-only, drop before upstream): info-level logging and efidebug.
      - |
        cat >> .config <<'EOF'
        CONFIG_LOG=y
        CONFIG_LOG_MAX_LEVEL=6
        CONFIG_LOG_DEFAULT_LEVEL=6
        CONFIG_LOG_CONSOLE=y
        CONFIG_CMD_LOG=y
        CONFIG_CMD_EFIDEBUG=y
        EOF
      - |
        make olddefconfig
        grep -E '^CONFIG_(EFI_LOADER_BOUNCE|LOG|CMD_LOG|CMD_EFIDEBUG)' .config
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" \
          BL31=/libs/arm-trusted-firmware/rk3568/bl31.elf \
          ROCKCHIP_TPL=/libs/rkbin/rk3566_ddr_1056MHz_v1.23.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/soquartz-cm4
        cp u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/soquartz-cm4
finalize:
  - from: /rootfs
    to: /rootfs
