# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-soquartz-cm4
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  # arm-trusted-firmware treats rk3566/rk3568 as a single platform
  - stage: arm-trusted-firmware-rk3568
  - stage: rkbin-rk3566
steps:
  - sources:
      - url: https://ftp.denx.de/pub/u-boot/u-boot-{{ .uboot_soquartz_version }}.tar.bz2
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_soquartz_sha256 }}"
        sha512: "{{ .uboot_soquartz_sha512 }}"
    env:
        SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # soquartz-cm4-rk3566
      - |
        tar xf u-boot.tar.bz2 --strip-components=1
      - |
        make soquartz-cm4-rk3566_defconfig
      # mkeficapsule (host tool, unused here) needs gnutls PKCS#11 since v2026.07,
      # which the toolchain's gnutls doesn't provide.
      - |
        echo '# CONFIG_TOOLS_MKEFICAPSULE is not set' >> .config
      # DEBUG (test-only): don't persist EFI variables to ubootefi.var on the ESP,
      # to test whether efi_mgr hangs in the FAT write on first boot.
      - |
        printf '# CONFIG_EFI_VARIABLE_FILE_STORE is not set\nCONFIG_EFI_VARIABLE_NO_STORE=y\n' >> .config
      # DEBUG (test-only, drop before upstream): info-level logging, efidebug,
      # memtest/rng commands, and the DW watchdog armed by raw register writes
      # (~89 s at 24 MHz, unfed by U-Boot; Linux dw_wdt takes it over) so hangs self-reset.
      # The DM designware_wdt driver fails to probe on rk3566 here, so it isn't used.
      # Preboot ungates PCLK/TCLK_WDT_NS (CRU CLKGATE_CON26 bits 13/14), deasserts
      # SRST_P/T_WDT_NS (SOFTRST_CON26 bits 5/6), and dumps the counter twice so the
      # boot log shows whether it is running.
      - |
        cat >> .config <<'EOF'
        CONFIG_USE_PREBOOT=y
        CONFIG_PREBOOT="mw.l 0xfdd20368 0x60000000; mw.l 0xfdd20468 0x00600000; md.l 0xfdd20368 1; md.l 0xfdd20468 1; md.l 0xfdd200dc 1; mw.l 0xfe600004 0xff; mw.l 0xfe600000 0x1; mw.l 0xfe60000c 0x76; md.l 0xfe600000 4; sleep 1; md.l 0xfe600000 4; echo WDT: armed v2 (clk ungated, rst deasserted), ~89s, unfed"
        CONFIG_CMD_MEMTEST=y
        CONFIG_CMD_RNG=y
        CONFIG_LOG=y
        CONFIG_LOG_MAX_LEVEL=6
        CONFIG_LOG_DEFAULT_LEVEL=6
        CONFIG_LOG_CONSOLE=y
        CONFIG_CMD_LOG=y
        CONFIG_CMD_EFIDEBUG=y
        EOF
      - |
        make olddefconfig
        grep -E '^.*CONFIG_(USE_PREBOOT|PREBOOT|CMD_MEMTEST|CMD_RNG|EFI_VARIABLE_FILE_STORE|EFI_VARIABLE_NO_STORE|TOOLS_MKEFICAPSULE|LMB_LIMIT_DMA_BELOW_RAM_TOP|LOG|CMD_LOG|CMD_EFIDEBUG)' .config
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" \
          BL31=/libs/arm-trusted-firmware/rk3568/bl31.elf \
          ROCKCHIP_TPL=/libs/rkbin/rk3566_ddr_1056MHz_v1.23.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/soquartz-cm4
        cp u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/soquartz-cm4
finalize:
  - from: /rootfs
    to: /rootfs
