# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-rock5b
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3588
  - stage: rkbin-rk3588

steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.bz2
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # rock-5b-rk3588
      - |
        tar xf u-boot.tar.bz2 --strip-components=1

        for patch in $(find /pkg/patches -type f -name "*.patch" | sort); do
          echo "Applying $patch"
          patch -p1 < $patch || (echo "Failed to apply patch $patch" && exit 1)
        done
      - |
        make rock5b-rk3588_defconfig
        # mkeficapsule needs GnuTLS with PKCS#11 since v2026.07, which tools doesn't provide
        echo '# CONFIG_TOOLS_MKEFICAPSULE is not set' >> .config
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/arm-trusted-firmware/rk3588/bl31.elf ROCKCHIP_TPL=/libs/rkbin/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.19.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rock5b
        cp -v -t /rootfs/artifacts/arm64/u-boot/rock5b u-boot-rockchip.bin u-boot-rockchip-spi.bin
finalize:
  - from: /rootfs
    to: /rootfs
